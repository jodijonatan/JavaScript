<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const name = prompt("Masukkan nama kamu");

      const masuk = confirm("Kamu yakin untuk masuk?");

      if (masuk) {
        alert(`Hello ${name}`);
      } else {
        alert("Kamu keluar");
      }
    </script>
  </body>
</html>
