<!-- namedNodeMap adalah kumpulan dari attributes yang ada di dalam elemen. -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <img
      id="image"
      src="https://plus.unsplash.com/premium_photo-1752497523819-9d1e02553a66?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxOTZ8fHxlbnwwfHx8fHw%3D"
      alt="image"
    />

    <script>
      const image = document.getElementById("image");

      // Menggunakan namedNodeMap untuk mendapatkan atribut
      const attributes = image.attributes;

      // Menampilkan semua atribut
      for (const atribut of attributes) {
        console.log(`Name: ${atribut.name}, Value: ${atribut.value}`);
      }

      image.setAttribute("width", "500");
    </script>
  </body>
</html>
